<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulador Interactivo de Diagramas de Venn — Red Descartes</title>
  
  <!-- KaTeX -->
  <link rel="stylesheet" href="../extra/katex/katex.min.css">
  <script src="../extra/katex/katex.min.js"></script>
  <script src="../extra/katex/contrib/auto-render.min.js"></script>

  <style>
    :root {
      /* MODO CLARO (Default) */
      --bg-color: #ffffff;
      --card-bg: #f6f8fa;
      --border-color: #d0d7de;
      --accent-color: #0969da;
      --accent-green: #1a7f37;
      --accent-purple: #8250df;
      --accent-orange: #cf222e;
      --text-color: #24292f;
      --text-bright: #0f172a;
      --btn-bg: #f3f4f6;
      --btn-hover: #e5e7eb;
      --info-bg: #f0f7ff;
      --svg-u-fill: #ffffff;
      --svg-u-stroke: #d0d7de;
      --svg-u-text: #57606a;
      --svg-label-text: #0f172a;
    }

    :root[data-theme="dark"] {
      /* MODO OSCURO */
      --bg-color: #0d1117;
      --card-bg: #161b22;
      --border-color: #30363d;
      --accent-color: #58a6ff;
      --accent-green: #39d353;
      --accent-purple: #bc8cff;
      --accent-orange: #f0883e;
      --text-color: #c9d1d9;
      --text-bright: #ffffff;
      --btn-bg: #21262d;
      --btn-hover: #30363d;
      --info-bg: #0d1117;
      --svg-u-fill: #161b22;
      --svg-u-stroke: #30363d;
      --svg-u-text: #8b949e;
      --svg-label-text: #ffffff;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    h2 {
      color: var(--accent-color);
      margin-top: 0;
      margin-bottom: 8px;
      font-size: 1.3rem;
      text-align: center;
    }

    .container {
      width: 100%;
      max-width: 760px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .controls-panel {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 12px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
    }

    .btn {
      background: var(--btn-bg);
      color: var(--text-color);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 8px 12px;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn:hover {
      background: var(--btn-hover);
      color: var(--text-bright);
      border-color: var(--accent-color);
    }

    .btn.active {
      background: var(--accent-color);
      color: #ffffff;
      font-weight: bold;
      border-color: var(--accent-color);
    }

    .btn-mode {
      background: var(--accent-color);
      color: #ffffff;
    }

    .venn-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    svg {
      max-width: 100%;
      height: auto;
    }

    .venn-region {
      cursor: pointer;
      transition: fill 0.3s ease, stroke 0.3s ease;
    }

    .venn-region:hover {
      opacity: 0.85;
      stroke-width: 2.5px;
    }

    .info-box {
      width: 100%;
      background: var(--info-bg);
      border-left: 4px solid var(--accent-color);
      border-radius: 0 6px 6px 0;
      padding: 12px 16px;
      box-sizing: border-box;
      margin-top: 12px;
      border: 1px solid var(--border-color);
      border-left-width: 4px;
    }

    .info-title {
      font-weight: bold;
      color: var(--accent-color);
      margin-bottom: 4px;
    }

    .katex-formula {
      font-size: 1.15rem;
      color: var(--text-bright);
      margin: 6px 0;
    }

    .explanation {
      font-size: 0.9rem;
      line-height: 1.4;
      color: var(--text-color);
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>🧪 Escena Interactiva: Diagrama de Venn (DescartesJS HTML5)</h2>
    
    <div class="controls-panel">
      <button class="btn btn-mode" id="btn-toggle-sets">Cambiar a 3 Conjuntos (A, B, C)</button>
      <button class="btn btn-mode" id="btn-reset">Limpiar Todo</button>
    </div>

    <div class="controls-panel" id="op-buttons">
      <!-- Dynamic Buttons -->
    </div>

    <div class="venn-card">
      <svg id="venn-svg" viewBox="0 0 500 320" width="500" height="320">
        <!-- SVG content generated dynamically -->
      </svg>

      <div class="info-box">
        <div class="info-title" id="info-title">Operación Seleccionada</div>
        <div class="katex-formula" id="info-formula">\(A \cup B\)</div>
        <div class="explanation" id="info-exp">Haz clic en los botones superiores o directamente en las regiones del diagrama para explorar la notación de conjuntos.</div>
      </div>
    </div>
  </div>

  <script>
    let mode3Sets = false;
    let activeRegions = new Set();
    let currentTheme = 'light';

    // Manejador de sincronización de temas con el libro padre
    function applyTheme(theme) {
      currentTheme = theme;
      document.documentElement.setAttribute('data-theme', theme);
      updateSVG();
    }

    window.addEventListener('message', (event) => {
      if (event.data && event.data.type === 'THEME_CHANGE') {
        applyTheme(event.data.theme);
      }
    });

    // Intentar leer el tema inicial desde el padre si está disponible
    try {
      if (window.parent && window.parent.document && window.parent.document.documentElement) {
        const parentTheme = window.parent.document.documentElement.getAttribute('data-theme') || 'light';
        applyTheme(parentTheme);
      }
    } catch(e) {}

    const presetOps2 = [
      { id: 'union', label: 'A ∪ B', formula: 'A \\cup B', regions: ['rA', 'rB', 'rAB'], exp: 'Unión: Elementos que pertenecen a A, a B o a ambos.' },
      { id: 'inter', label: 'A ∩ B', formula: 'A \\cap B', regions: ['rAB'], exp: 'Intersección: Elementos comunes que pertenecen simultáneamente a A y a B.' },
      { id: 'diffA', label: 'A \\ B', formula: 'A \\setminus B', regions: ['rA'], exp: 'Diferencia A - B: Elementos que pertenecen a A pero NO a B.' },
      { id: 'diffB', label: 'B \\ A', formula: 'B \\setminus A', regions: ['rB'], exp: 'Diferencia B - A: Elementos que pertenecen a B pero NO a A.' },
      { id: 'symdiff', label: 'A Δ B', formula: 'A \\Delta B', regions: ['rA', 'rB'], exp: 'Diferencia Simétrica: Elementos que pertenecen a A o a B, pero NO a ambos.' },
      { id: 'compA', label: "A'", formula: "A'", regions: ['rB', 'rU'], exp: "Complemento de A: Elementos del conjunto Universal que NO pertenecen a A." },
      { id: 'demorgan1', label: "(A ∪ B)'", formula: "(A \\cup B)'", regions: ['rU'], exp: "1ª Ley de De Morgan: El complemento de la unión es la intersección de los complementos (A' ∩ B')." },
    ];

    const presetOps3 = [
      { id: 'union3', label: 'A ∪ B ∪ C', formula: 'A \\cup B \\cup C', regions: ['rA', 'rB', 'rC', 'rAB', 'rAC', 'rBC', 'rABC'], exp: 'Unión de tres conjuntos: Elementos presentes en al menos uno de los tres conjuntos.' },
      { id: 'inter3', label: 'A ∩ B ∩ C', formula: 'A \\cap B \\cap C', regions: ['rABC'], exp: 'Intersección triple: Elementos comunes a los tres conjuntos A, B y C simultáneamente.' },
      { id: 'distrib', label: 'A ∩ (B ∪ C)', formula: 'A \\cap (B \\cup C)', regions: ['rAB', 'rAC', 'rABC'], exp: 'Propiedad Distributiva: Intersección de A con la unión de B y C (equivale a (A∩B) ∪ (A∩C)).' },
      { id: 'onlyA', label: 'A \\ (B ∪ C)', formula: 'A \\setminus (B \\cup C)', regions: ['rA'], exp: 'Elementos exclusivos de A (ningún elemento en B ni en C).' },
    ];

    function renderButtons() {
      const container = document.getElementById('op-buttons');
      container.innerHTML = '';
      const list = mode3Sets ? presetOps3 : presetOps2;

      list.forEach(op => {
        const btn = document.createElement('button');
        btn.className = 'btn';
        btn.innerHTML = `<span>\\(${op.formula}\\)</span>`;
        btn.onclick = () => applyPreset(op);
        container.appendChild(btn);
      });

      renderMathInElement(container);
    }

    function applyPreset(op) {
      activeRegions = new Set(op.regions);
      document.getElementById('info-title').innerText = op.label;
      document.getElementById('info-formula').innerHTML = `\\(${op.formula}\\)`;
      document.getElementById('info-exp').innerText = op.exp;
      renderMathInElement(document.getElementById('info-formula'));
      updateSVG();
    }

    function toggleRegion(regId) {
      if (activeRegions.has(regId)) {
        activeRegions.delete(regId);
      } else {
        activeRegions.add(regId);
      }
      document.getElementById('info-title').innerText = 'Región Seleccionada Manualmente';
      document.getElementById('info-formula').innerText = `Modo Interactivo (Regiones activas: ${activeRegions.size})`;
      document.getElementById('info-exp').innerText = 'Has personalizado la región sombreada directamente en el gráfico SVG.';
      updateSVG();
    }

    function drawSVG2Sets() {
      const svg = document.getElementById('venn-svg');
      const isDark = (currentTheme === 'dark');
      const uFill = isDark ? '#161b22' : '#ffffff';
      const uStroke = isDark ? '#30363d' : '#d0d7de';
      const uText = isDark ? '#8b949e' : '#57606a';
      const labelText = isDark ? '#ffffff' : '#0f172a';

      const colorA = isDark ? '88,166,255' : '9,105,218';
      const colorB = isDark ? '57,211,83' : '26,127,55';
      const colorAB = isDark ? '188,140,255' : '130,80,223';

      svg.innerHTML = `
        <defs>
          <mask id="mask-A-only">
            <rect x="0" y="0" width="500" height="320" fill="white" />
            <circle cx="310" cy="160" r="100" fill="black" />
          </mask>
          <mask id="mask-B-only">
            <rect x="0" y="0" width="500" height="320" fill="white" />
            <circle cx="190" cy="160" r="100" fill="black" />
          </mask>
          <mask id="mask-inter">
            <circle cx="310" cy="160" r="100" fill="white" />
          </mask>
        </defs>

        <!-- Universal Set U -->
        <rect id="rU" class="venn-region" x="20" y="20" width="460" height="280" rx="10" 
              fill="${activeRegions.has('rU') ? `rgba(${colorA},0.35)` : uFill}" 
              stroke="${uStroke}" stroke-width="2" onclick="toggleRegion('rU')"/>
        <text x="35" y="45" fill="${uText}" font-size="18" font-weight="bold">U</text>

        <!-- Region A Only -->
        <circle id="rA" class="venn-region" cx="190" cy="160" r="100" 
                mask="url(#mask-A-only)"
                fill="${activeRegions.has('rA') ? `rgba(${colorA},0.55)` : `rgba(${colorA},0.1)`}" 
                onclick="toggleRegion('rA')"/>

        <!-- Region B Only -->
        <circle id="rB" class="venn-region" cx="310" cy="160" r="100" 
                mask="url(#mask-B-only)"
                fill="${activeRegions.has('rB') ? `rgba(${colorB},0.55)` : `rgba(${colorB},0.1)`}" 
                onclick="toggleRegion('rB')"/>

        <!-- Region A inter B -->
        <circle id="rAB" class="venn-region" cx="190" cy="160" r="100" 
                mask="url(#mask-inter)"
                fill="${activeRegions.has('rAB') ? `rgba(${colorAB},0.65)` : `rgba(${colorAB},0.15)`}" 
                onclick="toggleRegion('rAB')"/>

        <!-- Circle Outlines -->
        <circle cx="190" cy="160" r="100" fill="none" stroke="rgb(${colorA})" stroke-width="2.5" pointer-events="none"/>
        <circle cx="310" cy="160" r="100" fill="none" stroke="rgb(${colorB})" stroke-width="2.5" pointer-events="none"/>

        <!-- Labels -->
        <text x="140" y="165" fill="${labelText}" font-size="22" font-weight="bold" pointer-events="none">A</text>
        <text x="340" y="165" fill="${labelText}" font-size="22" font-weight="bold" pointer-events="none">B</text>
      `;
    }

    function drawSVG3Sets() {
      const svg = document.getElementById('venn-svg');
      const isDark = (currentTheme === 'dark');
      const uFill = isDark ? '#161b22' : '#ffffff';
      const uStroke = isDark ? '#30363d' : '#d0d7de';
      const uText = isDark ? '#8b949e' : '#57606a';
      const labelText = isDark ? '#ffffff' : '#0f172a';

      const colorA = isDark ? '88,166,255' : '9,105,218';
      const colorB = isDark ? '57,211,83' : '26,127,55';
      const colorC = isDark ? '188,140,255' : '130,80,223';

      svg.innerHTML = `
        <rect id="rU" class="venn-region" x="20" y="20" width="460" height="280" rx="10" 
              fill="${activeRegions.has('rU') ? `rgba(${colorA},0.35)` : uFill}" 
              stroke="${uStroke}" stroke-width="2" onclick="toggleRegion('rU')"/>
        <text x="35" y="45" fill="${uText}" font-size="18" font-weight="bold">U</text>

        <circle id="rA" class="venn-region" cx="200" cy="130" r="85" 
                fill="${activeRegions.has('rA') || activeRegions.has('rAB') || activeRegions.has('rAC') || activeRegions.has('rABC') ? `rgba(${colorA},0.45)` : `rgba(${colorA},0.08)`}" 
                stroke="rgb(${colorA})" stroke-width="2" onclick="toggleRegion('rA')"/>
        <circle id="rB" class="venn-region" cx="300" cy="130" r="85" 
                fill="${activeRegions.has('rB') || activeRegions.has('rAB') || activeRegions.has('rBC') || activeRegions.has('rABC') ? `rgba(${colorB},0.45)` : `rgba(${colorB},0.08)`}" 
                stroke="rgb(${colorB})" stroke-width="2" onclick="toggleRegion('rB')"/>
        <circle id="rC" class="venn-region" cx="250" cy="205" r="85" 
                fill="${activeRegions.has('rC') || activeRegions.has('rAC') || activeRegions.has('rBC') || activeRegions.has('rABC') ? `rgba(${colorC},0.45)` : `rgba(${colorC},0.08)`}" 
                stroke="rgb(${colorC})" stroke-width="2" onclick="toggleRegion('rC')"/>

        <text x="160" y="110" fill="${labelText}" font-size="20" font-weight="bold" pointer-events="none">A</text>
        <text x="330" y="110" fill="${labelText}" font-size="20" font-weight="bold" pointer-events="none">B</text>
        <text x="245" y="260" fill="${labelText}" font-size="20" font-weight="bold" pointer-events="none">C</text>
      `;
    }

    function updateSVG() {
      if (mode3Sets) {
        drawSVG3Sets();
      } else {
        drawSVG2Sets();
      }
    }

    document.getElementById('btn-toggle-sets').onclick = () => {
      mode3Sets = !mode3Sets;
      document.getElementById('btn-toggle-sets').innerText = mode3Sets ? 'Cambiar a 2 Conjuntos (A, B)' : 'Cambiar a 3 Conjuntos (A, B, C)';
      activeRegions.clear();
      renderButtons();
      updateSVG();
    };

    document.getElementById('btn-reset').onclick = () => {
      activeRegions.clear();
      document.getElementById('info-title').innerText = 'Selecciona una operación';
      document.getElementById('info-formula').innerText = '';
      document.getElementById('info-exp').innerText = 'Haz clic en los botones o en el diagrama para comenzar.';
      updateSVG();
    };

    renderButtons();
    applyPreset(presetOps2[0]);
  </script>
</body>
</html>
