<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulador Interactivo de Diagramas de Venn — Red Descartes</title>
  
  <!-- KaTeX -->
  <link rel="stylesheet" href="../extra/katex/katex.min.css">
  <script src="../extra/katex/katex.min.js"></script>
  <script src="../extra/katex/contrib/auto-render.min.js"></script>

  <style>
    :root {
      /* MODO CLARO (Default) */
      --bg-color: #ffffff;
      --card-bg: #f6f8fa;
      --border-color: #d0d7de;
      --accent-color: #0969da;
      --accent-green: #1a7f37;
      --accent-purple: #8250df;
      --accent-orange: #cf222e;
      --text-color: #24292f;
      --text-bright: #0f172a;
      --btn-bg: #f3f4f6;
      --btn-hover: #e5e7eb;
      --info-bg: #f0f7ff;
      --svg-u-fill: #ffffff;
      --svg-u-stroke: #d0d7de;
      --svg-u-text: #57606a;
      --svg-label-text: #0f172a;
    }

    :root[data-theme="dark"] {
      /* MODO OSCURO */
      --bg-color: #0d1117;
      --card-bg: #161b22;
      --border-color: #30363d;
      --accent-color: #58a6ff;
      --accent-green: #39d353;
      --accent-purple: #bc8cff;
      --accent-orange: #f0883e;
      --text-color: #c9d1d9;
      --text-bright: #ffffff;
      --btn-bg: #21262d;
      --btn-hover: #30363d;
      --info-bg: #0d1117;
      --svg-u-fill: #161b22;
      --svg-u-stroke: #30363d;
      --svg-u-text: #8b949e;
      --svg-label-text: #ffffff;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 8px 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-sizing: border-box;
      overflow-x: hidden;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    h2 {
      color: var(--accent-color);
      margin-top: 0;
      margin-bottom: 4px;
      font-size: 0.88rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      text-align: center;
    }

    .container {
      width: 100%;
      max-width: 780px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .controls-panel {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 6px 8px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: center;
    }

    .btn {
      background: var(--btn-bg);
      color: var(--text-color);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 5px 10px;
      font-size: 0.82rem;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .btn:hover {
      background: var(--btn-hover);
      color: var(--text-bright);
      border-color: var(--accent-color);
    }

    .btn.active {
      background: var(--accent-color);
      color: #ffffff;
      font-weight: bold;
      border-color: var(--accent-color);
    }

    .venn-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    svg {
      max-width: 100%;
      height: 290px;
      user-select: none;
    }

    .venn-region {
      cursor: pointer;
      transition: fill 0.25s ease, stroke 0.25s ease;
    }

    .venn-region:hover {
      filter: brightness(1.2);
    }

    .info-box {
      margin-top: 8px;
      width: 100%;
      background: var(--info-bg);
      border: 1px solid var(--accent-color);
      border-radius: 6px;
      padding: 8px 12px;
      box-sizing: border-box;
      text-align: center;
    }

    .info-title {
      font-weight: bold;
      font-size: 0.95rem;
      color: var(--accent-color);
      margin-bottom: 2px;
    }

    .katex-formula {
      font-size: 1.05rem;
      margin: 4px 0;
      color: var(--text-bright);
    }

    .explanation {
      font-size: 0.82rem;
      color: var(--text-color);
      line-height: 1.35;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>🔵 Simulador Interactivo de Diagramas de Venn & Operaciones Booleanas</h2>

    <div class="controls-panel">
      <button class="btn active" id="btn-toggle-sets">Cambiar a 3 Conjuntos (A, B, C)</button>
      <button class="btn" id="btn-reset">↺ Limpiar Regiones</button>
    </div>

    <!-- Botones de Operaciones Predeterminadas -->
    <div class="controls-panel" id="op-buttons"></div>

    <div class="venn-card">
      <svg id="venn-svg" viewBox="0 0 500 320"></svg>

      <div class="info-box">
        <div class="info-title" id="info-title">Unión A ∪ B</div>
        <div class="katex-formula" id="info-formula">\(A \cup B\)</div>
        <div class="explanation" id="info-exp">Elementos que pertenecen a A, a B o a ambos.</div>
      </div>
    </div>
  </div>

  <script>
    let mode3Sets = false;
    let activeRegions = new Set();
    let currentTheme = 'light';
    let currentOpId = 'union';

    function applyTheme(theme) {
      currentTheme = theme;
      document.documentElement.setAttribute('data-theme', theme);
      updateSVG();
    }

    window.addEventListener('message', (event) => {
      if (event.data && event.data.type === 'THEME_CHANGE') {
        applyTheme(event.data.theme);
      }
    });

    try {
      if (window.parent && window.parent.document) {
        const isDark = window.parent.document.body.classList.contains('dark') || window.parent.document.documentElement.getAttribute('data-theme') === 'dark';
        applyTheme(isDark ? 'dark' : 'light');
      }
    } catch(e) {}

    // ── CATÁLOGO EXTENDIDO DE OPERACIONES (19 OPERACIONES) ─────────────────
    const presetOps2 = [
      { id: 'union', label: 'A ∪ B', formula: 'A \\cup B', regions: ['rA', 'rB', 'rAB'], exp: 'Unión: Elementos que pertenecen a A, a B o a ambos.' },
      { id: 'inter', label: 'A ∩ B', formula: 'A \\cap B', regions: ['rAB'], exp: 'Intersección: Elementos comunes que pertenecen simultáneamente a A y a B.' },
      { id: 'diffA', label: 'A \\ B', formula: 'A \\setminus B', regions: ['rA'], exp: 'Diferencia A \\ B: Elementos que pertenecen exclusivamente a A y no a B.' },
      { id: 'diffB', label: 'B \\ A', formula: 'B \\setminus A', regions: ['rB'], exp: 'Diferencia B \\ A: Elementos que pertenecen exclusivamente a B y no a A.' },
      { id: 'symdiff', label: 'A Δ B', formula: 'A \\Delta B = (A \\setminus B) \\cup (B \\setminus A)', regions: ['rA', 'rB'], exp: 'Diferencia Simétrica: Elementos que pertenecen a A o a B, pero NO a ambos.' },
      { id: 'compA', label: "Aᶜ", formula: "A^c = \\mathcal{U} \\setminus A", regions: ['rB', 'rExterior'], exp: "Complemento de A: Todo el universo fuera del círculo A (Solo B + Exterior)." },
      { id: 'compB', label: "Bᶜ", formula: "B^c = \\mathcal{U} \\setminus B", regions: ['rA', 'rExterior'], exp: "Complemento de B: Todo el universo fuera del círculo B (Solo A + Exterior)." },
      { id: 'demorgan1', label: "(A ∪ B)ᶜ", formula: "(A \\cup B)^c = A^c \\cap B^c", regions: ['rExterior'], exp: "1ª Ley de De Morgan: El complemento de la unión deja iluminada únicamente la región exterior a ambos círculos." },
      { id: 'demorgan2', label: "(A ∩ B)ᶜ", formula: "(A \\cap B)^c = A^c \\cup B^c", regions: ['rA', 'rB', 'rExterior'], exp: "2ª Ley de De Morgan: Todo el universo excepto la intersección central." },
    ];

    const presetOps3 = [
      { id: 'union3', label: 'A ∪ B ∪ C', formula: 'A \\cup B \\cup C', regions: ['rA', 'rB', 'rC', 'rAB', 'rAC', 'rBC', 'rABC'], exp: 'Unión de 3 conjuntos: Elementos presentes en al menos uno de los tres conjuntos.' },
      { id: 'inter3', label: 'A ∩ B ∩ C', formula: 'A \\cap B \\cap C', regions: ['rABC'], exp: 'Intersección triple: Elementos comunes a los tres conjuntos A, B y C simultáneamente.' },
      { id: 'distrib', label: 'A ∩ (B ∪ C)', formula: 'A \\cap (B \\cup C) = (A \\cap B) \\cup (A \\cap C)', regions: ['rAB', 'rAC', 'rABC'], exp: 'Ley Distributiva: Intersección de A con la unión de B y C.' },
      { id: 'onlyA', label: 'A \\ (B ∪ C)', formula: 'A \\setminus (B \\cup C)', regions: ['rA'], exp: 'Exclusivo de A: Elementos pertenecientes únicamente a A y a ningún otro conjunto.' },
      { id: 'onlyB', label: 'B \\ (A ∪ C)', formula: 'B \\setminus (A \\cup C)', regions: ['rB'], exp: 'Exclusivo de B: Elementos pertenecientes únicamente a B.' },
      { id: 'onlyC', label: 'C \\ (A ∪ B)', formula: 'C \\setminus (A \\cup B)', regions: ['rC'], exp: 'Exclusivo de C: Elementos pertenecientes únicamente a C.' },
      { id: 'compUnion3', label: "(A ∪ B ∪ C)ᶜ", formula: "(A \\cup B \\cup C)^c", regions: ['rExterior3'], exp: "Complemento de la unión triple: Región exterior sin incluir ningún círculo." },
      { id: 'exacto2', label: 'Exactamente 2', formula: '(A \\cap B \\setminus C) \\cup (A \\cap C \\setminus B) \\cup (B \\cap C \\setminus A)', regions: ['rAB', 'rAC', 'rBC'], exp: 'Elementos que pertenecen exactamente a dos conjuntos pero no al tercero.' },
      { id: 'exacto1', label: 'Exactamente 1', formula: 'Solo A \\cup Solo B \\cup Solo C', regions: ['rA', 'rB', 'rC'], exp: 'Elementos que pertenecen a exactamente un solo conjunto.' },
      { id: 'c3_demorgan', label: '(A ∩ B ∩ C)ᶜ', formula: '(A \\cap B \\cap C)^c', regions: ['rA', 'rB', 'rC', 'rAB', 'rAC', 'rBC', 'rExterior3'], exp: 'Complemento de la intersección triple: Todo el universo excepto el núcleo central compartido.' },
    ];

    function renderButtons() {
      const container = document.getElementById('op-buttons');
      container.innerHTML = '';
      const list = mode3Sets ? presetOps3 : presetOps2;

      list.forEach(op => {
        const btn = document.createElement('button');
        btn.className = `btn ${currentOpId === op.id ? 'active' : ''}`;
        btn.innerHTML = `<span>\\(${op.formula.split('=')[0].trim()}\\)</span>`;
        btn.onclick = () => applyPreset(op);
        container.appendChild(btn);
      });

      renderMathInElement(container);
    }

    function applyPreset(op) {
      currentOpId = op.id;
      activeRegions = new Set(op.regions);
      document.getElementById('info-title').innerText = op.label;
      document.getElementById('info-formula').innerHTML = `\\(${op.formula}\\)`;
      document.getElementById('info-exp').innerText = op.exp;
      renderMathInElement(document.getElementById('info-formula'));
      renderButtons();
      updateSVG();
    }

    function toggleRegion(regId) {
      currentOpId = null;
      if (activeRegions.has(regId)) {
        activeRegions.delete(regId);
      } else {
        activeRegions.add(regId);
      }
      document.getElementById('info-title').innerText = 'Exploración Manual de Regiones';
      document.getElementById('info-formula').innerText = `Regiones activas seleccionadas: ${activeRegions.size}`;
      document.getElementById('info-exp').innerText = 'Haz clic en cualquier región atómica del diagrama SVG para activar o desactivar su sombreado.';
      renderButtons();
      updateSVG();
    }

    function drawSVG2Sets() {
      const svg = document.getElementById('venn-svg');
      const isDark = (currentTheme === 'dark');
      const uFill = isDark ? '#161b22' : '#ffffff';
      const uStroke = isDark ? '#30363d' : '#d0d7de';
      const uText = isDark ? '#8b949e' : '#57606a';
      const labelText = isDark ? '#ffffff' : '#0f172a';

      const colorA = isDark ? '88,166,255' : '9,105,218';
      const colorB = isDark ? '57,211,83' : '26,127,55';
      const colorAB = isDark ? '188,140,255' : '130,80,223';
      const colorExt = isDark ? '240,136,62' : '207,34,46';

      svg.innerHTML = `
        <defs>
          <mask id="mask-A-only">
            <rect x="0" y="0" width="500" height="320" fill="white" />
            <circle cx="310" cy="160" r="100" fill="black" />
          </mask>
          <mask id="mask-B-only">
            <rect x="0" y="0" width="500" height="320" fill="white" />
            <circle cx="190" cy="160" r="100" fill="black" />
          </mask>
          <mask id="mask-inter">
            <circle cx="310" cy="160" r="100" fill="white" />
          </mask>
          <!-- MÁSCARA EXTERIOR 2 CONJUNTOS (Recorta los 2 círculos con 100% de transparencia interior) -->
          <mask id="maskExterior2">
            <rect x="0" y="0" width="500" height="320" fill="white" />
            <circle cx="190" cy="160" r="100" fill="black" />
            <circle cx="310" cy="160" r="100" fill="black" />
          </mask>
        </defs>

        <!-- Fondo del Universo -->
        <rect x="15" y="15" width="470" height="290" rx="12" fill="${uFill}" stroke="${uStroke}" stroke-width="2" />
        <text x="35" y="45" fill="${uText}" font-size="18" font-weight="bold">𝒰</text>

        <!-- Región Exterior (Complemento de la unión) -->
        <rect class="venn-region" x="15" y="15" width="470" height="290" rx="12"
              mask="url(#maskExterior2)"
              fill="${activeRegions.has('rExterior') ? `rgba(${colorExt}, 0.45)` : 'transparent'}"
              onclick="toggleRegion('rExterior')" />

        <!-- Región Solo A -->
        <circle id="rA" class="venn-region" cx="190" cy="160" r="100"
                mask="url(#mask-A-only)"
                fill="${activeRegions.has('rA') ? `rgba(${colorA}, 0.55)` : `rgba(${colorA}, 0.08)`}"
                onclick="toggleRegion('rA')" />

        <!-- Región Solo B -->
        <circle id="rB" class="venn-region" cx="310" cy="160" r="100"
                mask="url(#mask-B-only)"
                fill="${activeRegions.has('rB') ? `rgba(${colorB}, 0.55)` : `rgba(${colorB}, 0.08)`}"
                onclick="toggleRegion('rB')" />

        <!-- Intersección A ∩ B -->
        <circle id="rAB" class="venn-region" cx="190" cy="160" r="100"
                mask="url(#mask-inter)"
                fill="${activeRegions.has('rAB') ? `rgba(${colorAB}, 0.70)` : `rgba(${colorAB}, 0.12)`}"
                onclick="toggleRegion('rAB')" />

        <!-- Contornos de los círculos -->
        <circle cx="190" cy="160" r="100" fill="none" stroke="rgb(${colorA})" stroke-width="2.5" pointer-events="none" />
        <circle cx="310" cy="160" r="100" fill="none" stroke="rgb(${colorB})" stroke-width="2.5" pointer-events="none" />

        <!-- Etiquetas de Conjuntos -->
        <text x="135" y="165" fill="${labelText}" font-size="22" font-weight="bold" pointer-events="none">A</text>
        <text x="345" y="165" fill="${labelText}" font-size="22" font-weight="bold" pointer-events="none">B</text>
      `;
    }

    function drawSVG3Sets() {
      const svg = document.getElementById('venn-svg');
      const isDark = (currentTheme === 'dark');
      const uFill = isDark ? '#161b22' : '#ffffff';
      const uStroke = isDark ? '#30363d' : '#d0d7de';
      const uText = isDark ? '#8b949e' : '#57606a';
      const labelText = isDark ? '#ffffff' : '#0f172a';

      const colorA = isDark ? '88,166,255' : '9,105,218';
      const colorB = isDark ? '57,211,83' : '26,127,55';
      const colorC = isDark ? '188,140,255' : '130,80,223';
      const colorAB = isDark ? '227,179,65' : '179,134,0';
      const colorAC = isDark ? '255,123,114' : '207,34,46';
      const colorBC = isDark ? '56,189,248' : '2,132,199';
      const colorABC = isDark ? '240,136,62' : '217,119,6';
      const colorExt = isDark ? '163,113,247' : '130,80,223';

      svg.innerHTML = `
        <defs>
          <!-- MÁSCARA EXTERIOR 3 CONJUNTOS (Recorta los 3 círculos) -->
          <mask id="maskExterior3">
            <rect x="0" y="0" width="500" height="320" fill="white" />
            <circle cx="200" cy="135" r="85" fill="black" />
            <circle cx="300" cy="135" r="85" fill="black" />
            <circle cx="250" cy="205" r="85" fill="black" />
          </mask>
          <mask id="mask-A3-only">
            <rect x="0" y="0" width="500" height="320" fill="white" />
            <circle cx="300" cy="135" r="85" fill="black" />
            <circle cx="250" cy="205" r="85" fill="black" />
          </mask>
          <mask id="mask-B3-only">
            <rect x="0" y="0" width="500" height="320" fill="white" />
            <circle cx="200" cy="135" r="85" fill="black" />
            <circle cx="250" cy="205" r="85" fill="black" />
          </mask>
          <mask id="mask-C3-only">
            <rect x="0" y="0" width="500" height="320" fill="white" />
            <circle cx="200" cy="135" r="85" fill="black" />
            <circle cx="300" cy="135" r="85" fill="black" />
          </mask>
          <mask id="mask-AB3">
            <circle cx="300" cy="135" r="85" fill="white" />
            <circle cx="250" cy="205" r="85" fill="black" />
          </mask>
          <mask id="mask-AC3">
            <circle cx="250" cy="205" r="85" fill="white" />
            <circle cx="300" cy="135" r="85" fill="black" />
          </mask>
          <mask id="mask-BC3">
            <circle cx="250" cy="205" r="85" fill="white" />
            <circle cx="200" cy="135" r="85" fill="black" />
          </mask>
          <mask id="mask-ABC3">
            <circle cx="300" cy="135" r="85" fill="white" />
          </mask>
        </defs>

        <!-- Fondo del Universo -->
        <rect x="15" y="15" width="470" height="290" rx="12" fill="${uFill}" stroke="${uStroke}" stroke-width="2" />
        <text x="35" y="45" fill="${uText}" font-size="18" font-weight="bold">𝒰</text>

        <!-- Región Exterior (Complemento de la unión triple) -->
        <rect class="venn-region" x="15" y="15" width="470" height="290" rx="12"
              mask="url(#maskExterior3)"
              fill="${activeRegions.has('rExterior3') ? `rgba(${colorExt}, 0.45)` : 'transparent'}"
              onclick="toggleRegion('rExterior3')" />

        <!-- Región Solo A -->
        <circle id="rA" class="venn-region" cx="200" cy="135" r="85"
                mask="url(#mask-A3-only)"
                fill="${activeRegions.has('rA') ? `rgba(${colorA}, 0.55)` : `rgba(${colorA}, 0.08)`}"
                onclick="toggleRegion('rA')" />

        <!-- Región Solo B -->
        <circle id="rB" class="venn-region" cx="300" cy="135" r="85"
                mask="url(#mask-B3-only)"
                fill="${activeRegions.has('rB') ? `rgba(${colorB}, 0.55)` : `rgba(${colorB}, 0.08)`}"
                onclick="toggleRegion('rB')" />

        <!-- Región Solo C -->
        <circle id="rC" class="venn-region" cx="250" cy="205" r="85"
                mask="url(#mask-C3-only)"
                fill="${activeRegions.has('rC') ? `rgba(${colorC}, 0.55)` : `rgba(${colorC}, 0.08)`}"
                onclick="toggleRegion('rC')" />

        <!-- Región (A ∩ B) \\ C -->
        <circle id="rAB" class="venn-region" cx="200" cy="135" r="85"
                mask="url(#mask-AB3)"
                fill="${activeRegions.has('rAB') ? `rgba(${colorAB}, 0.65)` : `rgba(${colorAB}, 0.12)`}"
                onclick="toggleRegion('rAB')" />

        <!-- Región (A ∩ C) \\ B -->
        <circle id="rAC" class="venn-region" cx="200" cy="135" r="85"
                mask="url(#mask-AC3)"
                fill="${activeRegions.has('rAC') ? `rgba(${colorAC}, 0.65)` : `rgba(${colorAC}, 0.12)`}"
                onclick="toggleRegion('rAC')" />

        <!-- Región (B ∩ C) \\ A -->
        <circle id="rBC" class="venn-region" cx="300" cy="135" r="85"
                mask="url(#mask-BC3)"
                fill="${activeRegions.has('rBC') ? `rgba(${colorBC}, 0.65)` : `rgba(${colorBC}, 0.12)`}"
                onclick="toggleRegion('rBC')" />

        <!-- Núcleo Central A ∩ B ∩ C -->
        <g mask="url(#mask-ABC3)">
          <circle id="rABC" class="venn-region" cx="200" cy="135" r="85"
                  mask="url(#mask-BC3)"
                  fill="${activeRegions.has('rABC') ? `rgba(${colorABC}, 0.80)` : `rgba(${colorABC}, 0.15)`}"
                  onclick="toggleRegion('rABC')" />
        </g>

        <!-- Contornos de los círculos -->
        <circle cx="200" cy="135" r="85" fill="none" stroke="rgb(${colorA})" stroke-width="2.5" pointer-events="none" />
        <circle cx="300" cy="135" r="85" fill="none" stroke="rgb(${colorB})" stroke-width="2.5" pointer-events="none" />
        <circle cx="250" cy="205" r="85" fill="none" stroke="rgb(${colorC})" stroke-width="2.5" pointer-events="none" />

        <!-- Etiquetas de Conjuntos -->
        <text x="145" y="115" fill="${labelText}" font-size="20" font-weight="bold" pointer-events="none">A</text>
        <text x="345" y="115" fill="${labelText}" font-size="20" font-weight="bold" pointer-events="none">B</text>
        <text x="245" y="275" fill="${labelText}" font-size="20" font-weight="bold" pointer-events="none">C</text>
      `;
    }

    function updateSVG() {
      if (mode3Sets) {
        drawSVG3Sets();
      } else {
        drawSVG2Sets();
      }
    }

    document.getElementById('btn-toggle-sets').onclick = () => {
      mode3Sets = !mode3Sets;
      document.getElementById('btn-toggle-sets').innerText = mode3Sets ? 'Cambiar a 2 Conjuntos (A, B)' : 'Cambiar a 3 Conjuntos (A, B, C)';
      applyPreset(mode3Sets ? presetOps3[0] : presetOps2[0]);
    };

    document.getElementById('btn-reset').onclick = () => {
      activeRegions.clear();
      currentOpId = null;
      document.getElementById('info-title').innerText = 'Regiones Limpias';
      document.getElementById('info-formula').innerText = '\\emptyset';
      document.getElementById('info-exp').innerText = 'Haz clic en los botones o en el diagrama para seleccionar regiones.';
      renderButtons();
      renderMathInElement(document.getElementById('info-formula'));
      updateSVG();
    };

    renderButtons();
    applyPreset(presetOps2[0]);
  </script>
